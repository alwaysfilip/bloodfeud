name: Package and release

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Run tests
        run: luajit tests/run.lua

  release:
    needs: test
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package and release
        uses: BigWigsMods/packager@v2
        with:
          # The name shown in CurseForge's file list: "BusinessMeeting-v0.4.0"
          # instead of the default "v0.2.1-forever". (The packager turns
          # spaces into underscores, so "Blood Feud v0.2.1" is not possible.)
          # The zip keeps its default name.
          args: '-n ":{package-name}-{project-version}"'
