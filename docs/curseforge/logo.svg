<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Business Meeting - PvP: a necktie in a crosshair. Original artwork, no game assets. -->
  <rect width="400" height="400" fill="#0b0c0f"/>
  <rect x="14" y="14" width="372" height="372" fill="#101216" stroke="#2b2f36" stroke-width="2"/>

  <!-- corner brackets -->
  <g fill="none" stroke="#d4a94e" stroke-width="8" stroke-linecap="square">
    <path d="M18 70V18h52"/>
    <path d="M330 18h52v52"/>
    <path d="M382 330v52h-52"/>
    <path d="M70 382H18v-52"/>
  </g>

  <!-- crosshair -->
  <g fill="none" stroke="#d4a94e" stroke-width="12" stroke-linecap="round">
    <circle cx="200" cy="200" r="116"/>
    <path d="M200 52v52M200 296v52M52 200h52M296 200h52"/>
  </g>

  <!-- necktie -->
  <polygon points="179,128 221,128 212,162 188,162" fill="#d8443a"/>
  <polygon points="200,128 221,128 212,162 200,162" fill="#a32a22"/>
  <polygon points="188,167 212,167 227,246 200,276 173,246" fill="#d8443a"/>
  <polygon points="200,167 212,167 227,246 200,276" fill="#a32a22"/>
</svg>
